<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ClickerBatyaSounds</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">

  <style>
    :root { 
      --red: #ff0000; --gold: #ffcc00; --blue: #00d4ff; 
      --glass: rgba(15, 15, 15, 0.9); --border: rgba(255, 255, 255, 0.1);
    }
    
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; font-family: 'Arial Black', sans-serif; font-weight: 900; user-select: none; }
    
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; text-transform: uppercase; }
    body { display: flex; justify-content: center; align-items: center; background-size: cover !important; background-position: center !important; }

    .snow { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    .snow::before { 
      content: ""; position: absolute; inset: -100% 0 0 0; 
      background-image: radial-gradient(4px 4px at 50px 100px, #fff, transparent), radial-gradient(6px 6px at 200px 300px, #fff, transparent);
      background-size: 400px 800px; animation: snow-move 3s linear infinite; opacity: 0.5; 
    }
    @keyframes snow-move { from { transform: translateY(0); } to { transform: translateY(100vh); } }

    /* СТАТИСТИКА */
    .stats { 
      position: fixed; top: 20px; left: 15px; 
      z-index: 20; padding: 15px; background: var(--glass); backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 20px;
    }
    #bal { font-size: 32px; color: var(--gold); }
    
    .btn-market {
      position: fixed; top: 20px; right: 15px;
      z-index: 20; padding: 12px 24px; background: var(--glass);
      border: 2px solid var(--gold); border-radius: 15px; color: var(--gold); cursor: pointer;
    }

    .controls { position: fixed; bottom: 20px; display: flex; gap: 10px; z-index: 20; }
    .btn-ui { padding: 12px 18px; background: var(--glass); border: 1px solid var(--border); border-radius: 15px; color: #fff; cursor: pointer; }

    /* КНОПКА КЛИКА */
    #crushBtn { 
      padding: 60px 100px; font-size: 50px; border-radius: 40px; border: none; 
      background: linear-gradient(180deg, #ff0000, #800); color: #fff; 
      box-shadow: 0 12px 0 #500; cursor: pointer; transition: 0.05s; z-index: 5;
    }
    #crushBtn:active { transform: translateY(8px); box-shadow: 0 4px 0 #500; }

    /* МАГАЗИН */
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .shop { width: 92%; max-height: 80vh; background: var(--glass); border-radius: 25px; padding: 20px; overflow-y: auto; border: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
    .card { background: rgba(255,255,255,0.05); border-radius: 18px; padding: 12px; text-align: center; border: 1px solid var(--border); }
    .buy { width: 100%; padding: 8px; border: none; border-radius: 10px; background: var(--red); color: #fff; cursor: pointer; }

    /* МИНИ ИГРА */
    #game-cnt { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
    #g-c { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>

<div class="snow"></div>
<audio id="bg" loop><source src="fonovaya_muzyka.mp3" type="audio/mpeg"></audio>

<div class="stats">
  <div id="bal">0</div>
  <div style="font-size:12px; color: var(--blue);">БУСТ: <span id="m-v">x1</span></div>
  <div style="color:var(--blue); font-size:18px; margin-top:8px;">🦈 <span id="sh">0</span></div>
</div>

<button class="btn-market" onclick="tS(true)">МАРКЕТ</button>

<div class="controls">
  <button class="btn-ui" onclick="sMG()" style="border-color: var(--blue); color: var(--blue);">ИГРА</button>
</div>

<div id="md" class="modal" onclick="if(event.target==this)tS(false)">
  <div class="shop">
    <div id="s-c" class="grid"></div>
  </div>
</div>

<button id="crushBtn">CRUSH</button>

<div id="game-cnt">
  <div style="position:absolute; top:40px; width:100%; text-align:center; color:var(--blue); font-size:32px; z-index:10;">🦈: <span id="g-s">0</span></div>
  <canvas id="g-c"></canvas>
</div>

<script>
  let state = JSON.parse(localStorage.getItem('cbs_save')) || { bal: 0, sh: 0, cS: "s1", cW: "w1", inv: ["s1", "w1"], inc: 10, aB: 1 };
  const eff = new Audio();

  function save() { localStorage.setItem('cbs_save', JSON.stringify(state)); }

  function uV() {
    document.getElementById('bal').innerText = Math.floor(state.bal).toLocaleString();
    document.getElementById('sh').innerText = state.sh.toLocaleString();
  }

  function tS(o) { document.getElementById('md').classList.toggle('active', o); if(o) rS('sounds'); }

  function rS(t) {
    const c = document.getElementById('s-c'); c.innerHTML = '<h3 style="grid-column:1/-1">МАГАЗИН ЗВУКОВ</h3>';
    // Здесь можно добавить звуки из FOLDERS
  }

  document.getElementById('crushBtn').onclick = (e) => {
    if(navigator.vibrate) navigator.vibrate(50);
    state.bal += state.inc * state.aB;
    uV(); save();
  };

  // МИНИ ИГРА (ПТИЦА - КРУГ)
  const cvs = document.getElementById('g-c'), ctx = cvs.getContext('2d');
  let gA = false, brd, ps, sc, f;

  function sMG() { 
    document.getElementById('game-cnt').style.display='block'; 
    cvs.width=window.innerWidth; cvs.height=window.innerHeight; 
    gA=true; sc=0; ps=[]; f=0; 
    brd={x:50, y:cvs.height/2, v:0, g:0.6, r:15}; // r - радиус круга
    gL(); 
  }

  function gL() {
    if(!gA) return; 
    ctx.clearRect(0,0,cvs.width,cvs.height); 
    
    brd.v += brd.g; brd.y += brd.v;

    if(f % 90 === 0) ps.push({x:cvs.width, y:Math.random()*(cvs.height-300)+150, w:60, g:250, p:false});

    ps.forEach((p, i) => {
      p.x -= 4;
      ctx.fillStyle = "#00d4ff";
      ctx.fillRect(p.x, 0, p.w, p.y - p.g/2);
      ctx.fillRect(p.x, p.y + p.g/2, p.w, cvs.height);

      if(!p.p && p.x < brd.x) { p.p=true; sc++; state.sh += 50; uV(); document.getElementById('g-s').innerText = sc; }
      
      // Столкновение круга с трубами
      if(brd.x + brd.r > p.x && brd.x - brd.r < p.x + p.w) {
        if(brd.y - brd.r < p.y - p.g/2 || brd.y + brd.r > p.y + p.g/2) gA = false;
      }
    });

    // Отрисовка КРУГЛОЙ птицы
    ctx.beginPath();
    ctx.arc(brd.x, brd.y, brd.r, 0, Math.PI * 2);
    ctx.fillStyle = "yellow";
    ctx.fill();
    ctx.closePath();

    if(brd.y + brd.r > cvs.height || brd.y - brd.r < 0) gA = false;

    if(!gA) {
      save();
      setTimeout(() => document.getElementById('game-cnt').style.display='none', 800);
    } else { f++; requestAnimationFrame(gL); }
  }

  document.getElementById('game-cnt').onclick = () => { if(gA) brd.v = -9; };

  uV();
</script>
</body>
</html>
