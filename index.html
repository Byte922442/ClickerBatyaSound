<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>ClickerBatyaSounds</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root { 
      --red: #ff0000; --gold: #ffcc00; --blue: #00d4ff; 
      --glass: rgba(10, 10, 10, 0.95); --border: rgba(255, 255, 255, 0.1); 
    }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    body { background-position: center !important; background-size: cover !important; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; }

    /* СНЕГ */
    .snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .snow-container::before {
      content: ""; position: absolute; top: -100%; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(3px 3px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(4px 4px at 150px 150px, #fff, rgba(0,0,0,0));
      background-size: 300px 300px; animation: snow-anim 15s linear infinite; opacity: 0.3;
    }
    @keyframes snow-anim { from { transform: translateY(0); } to { transform: translateY(100vh); } }

    /* ИНТЕРФЕЙС */
    .stats { position: fixed; top: 20px; left: 20px; z-index: 100; padding: 15px; border-radius: 18px; background: var(--glass); border: 1px solid var(--border); }
    #buff-timer { color: var(--red); font-weight: 900; font-size: 18px; display: none; text-shadow: 0 0 10px var(--red); }
    
    .controls-bottom { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
    .btn-ui { padding: 12px 20px; border-radius: 16px; background: var(--glass); border: 1px solid var(--border); color: white; font-weight: bold; cursor: pointer; }
    
    #crushBtn { padding: 50px 90px; font-size: 50px; font-weight: 900; background: linear-gradient(180deg, var(--red), #700); color: #fff; border: none; border-radius: 40px; box-shadow: 0 12px 0 #300; cursor: pointer; transition: 0.05s; z-index: 5; }
    #crushBtn:active { transform: translateY(6px); box-shadow: 0 6px 0 #300; }

    /* МОДАЛКА МАРКЕТА */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-overlay.active { display: flex; }
    .shop-window { width: 90%; max-height: 80vh; background: var(--glass); border-radius: 30px; padding: 20px; overflow-y: auto; border: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
    .item-card { background: rgba(255,255,255,0.05); border-radius: 20px; padding: 10px; text-align: center; border: 1px solid var(--border); }
    .wp-preview { width: 100%; height: 70px; border-radius: 10px; margin-bottom: 5px; background-size: cover; background-position: center; }
    .buy-btn { width: 100%; padding: 10px; border-radius: 10px; border: none; background: var(--red); color: #fff; font-weight: bold; margin-top: 5px; }

    /* МИНИ-ИГРА */
    #game-container { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; }
    #game-canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>

<div class="snow-container"></div>
<audio id="bgMusic" loop><source src="fonovaya_muzyka.mp3" type="audio/mpeg"></audio>

<div id="game-container">
    <div style="position:absolute; top:30px; width:100%; text-align:center; color:var(--blue); font-size:20px; font-weight:900;">СЧЕТ: <span id="game-score">0</span></div>
    <canvas id="game-canvas"></canvas>
</div>

<div class="stats">
  <div id="bal" style="font-size:30px; font-weight:900; color:var(--gold);">0</div>
  <div style="font-size:12px; opacity:0.8;">ДОХОД: <span id="mult-view" style="color:var(--blue)">x1</span></div>
  <div id="buff-timer">05:00</div>
  <div style="color:var(--blue); font-weight:bold; font-size:18px; margin-top:5px;">🦈 <span id="sharks">0</span></div>
</div>

<button class="btn-ui" style="position:fixed; top:20px; right:20px; z-index:100; color:var(--gold);" onclick="toggleShop(true)">МАРКЕТ</button>

<div class="controls-bottom">
  <button class="btn-ui" id="musicToggle" onclick="toggleMusic()">🎵 ВЫКЛ</button>
  <button class="btn-ui" onclick="startMiniGame()" style="color:var(--blue);">ИГРА</button>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target == this) toggleShop(false)">
  <div class="shop-window">
    <div style="display:flex; gap:8px; margin-bottom:15px; overflow-x:auto;">
        <button class="btn-ui" onclick="renderShop('sounds')">ЗВУКИ</button>
        <button class="btn-ui" onclick="renderShop('wallpapers')">ОБОИ</button>
        <button class="btn-ui" onclick="renderShop('buffs')">БАФФЫ</button>
    </div>
    <div id="shop-content" class="grid"></div>
  </div>
</div>

<button id="crushBtn">CRUSH</button>

<script>
  // 1. СЕРВИС-ВОРКЕР И ПОДСКАЗКА УСТАНОВКИ
  let deferredPrompt;
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    // Показываем предложение через 5 секунд игры
    setTimeout(() => {
      if (confirm("Установить ClickerBatya на рабочий стол?")) {
        deferredPrompt.prompt();
      }
    }, 5000);
  });

  // 2. ДАННЫЕ ИГРЫ
  const FOLDERS = {
    sounds: [
        { id: "s1", n: "УДАР", p: 0, inc: 10, f: "sounds.mp3" },
        { id: "s2", n: "БАЛГАРКА", p: 1000, inc: 50, f: "sound2.mp3" }
    ],
    wallpapers: [
        { id: "w1", n: "ДЕФОЛТ", p: 0, f: "" },
        { id: "w2", n: "БРИГАДА", p: 1000, f: "photo_7_2026-02-01_23-17-09.jpg" }
    ],
    buffs: [
      { id: "b2", n: "БУСТ x2", p: 500, mult: 2 }
    ]
  };

  let state = JSON.parse(localStorage.getItem('batya_v3_save')) || {
    balance: 0, sharks: 0, currentSound: "s1", currentWp: "w1", inv: ["s1", "w1"], income: 10, activeBuff: 1, buffEndTime: 0
  };

  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = 0.15;
  let musicEnabled = false;
  let effAudio = new Audio();

  function save() { localStorage.setItem('batya_v3_save', JSON.stringify(state)); }

  function updateVisuals() {
    document.getElementById('bal').innerText = Math.floor(state.balance).toLocaleString();
    document.getElementById('sharks').innerText = state.sharks.toLocaleString();
    const wp = FOLDERS.wallpapers.find(w => w.id === state.currentWp);
    document.body.style.backgroundImage = wp && wp.f ? `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url(${wp.f})` : "none";

    let now = Date.now();
    if (state.buffEndTime > now) {
      let left = Math.ceil((state.buffEndTime - now) / 1000);
      document.getElementById('buff-timer').style.display = 'block';
      document.getElementById('buff-timer').innerText = `БАФФ: ${left}с`;
      document.getElementById('mult-view').innerText = "x" + state.activeBuff;
    } else {
      state.activeBuff = 1;
      document.getElementById('buff-timer').style.display = 'none';
      document.getElementById('mult-view').innerText = "x1";
    }
  }

  function toggleMusic() {
    musicEnabled = !musicEnabled;
    if (musicEnabled) { bgMusic.play(); document.getElementById('musicToggle').innerText = "🎵 ВКЛ"; }
    else { bgMusic.pause(); document.getElementById('musicToggle').innerText = "🎵 ВЫКЛ"; }
  }

  function toggleShop(open) {
    document.getElementById('modal').classList.toggle('active', open);
    if(open) renderShop('sounds');
  }

  function renderShop(tab) {
    const container = document.getElementById('shop-content');
    container.innerHTML = '';
    FOLDERS[tab].forEach(item => {
      const owned = state.inv.includes(item.id);
      const isCur = (state.currentSound === item.id || state.currentWp === item.id);
      let preview = (tab === 'wallpapers' && item.f) ? `<div class="wp-preview" style="background-image:url(${item.f})"></div>` : '';
      
      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `${preview}<b>${item.n}</b><br>
        <button class="buy-btn" onclick="buy('${tab}','${item.id}')">${owned ? (isCur ? "АКТИВ" : "СЕТ") : item.p}</button>`;
      container.appendChild(card);
    });
  }

  window.buy = (tab, id) => {
    const item = FOLDERS[tab].find(x => x.id === id);
    if (tab === 'buffs') {
      if (state.sharks >= item.p) {
        state.sharks -= item.p; state.activeBuff = item.mult; state.buffEndTime = Date.now() + 300000;
        toggleShop(false);
      }
    } else {
      if (state.inv.includes(id)) {
        if(tab === 'sounds') { state.currentSound = id; state.income = item.inc; } else { state.currentWp = id; }
      } else if (state.balance >= item.p) {
        state.balance -= item.p; state.inv.push(id);
      }
    }
    save(); updateVisuals();
  };

  document.getElementById('crushBtn').onclick = () => {
    if (navigator.vibrate) navigator.vibrate(40); // ВИБРАЦИЯ
    const sData = FOLDERS.sounds.find(s => s.id === state.currentSound);
    effAudio.src = sData.f;
    effAudio.play();
    state.balance += (state.income * state.activeBuff);
    updateVisuals(); save();
  };

  // МИНИ-ИГРА ТРУБЫ
  const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d');
  let gameActive = false, bird, pipes, score, frame;

  function startMiniGame() {
    document.getElementById('game-container').style.display = 'block';
    canvas.width = Math.min(400, window.innerWidth);
    canvas.height = window.innerHeight;
    gameActive = true; score = 0; pipes = []; frame = 0;
    bird = { x: 50, y: canvas.height/2, v: 0, g: 0.5 };
    gameLoop();
  }

  function gameLoop() {
    if(!gameActive) return;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    bird.v += bird.g; bird.y += bird.v;
    if(frame % 100 === 0) pipes.push({ x: canvas.width, y: Math.random()*(canvas.height-300)+150, gap: 240, passed: false });
    pipes.forEach((p, i) => {
      p.x -= 3.5;
      ctx.fillStyle = "#00d4ff";
      ctx.fillRect(p.x, 0, 60, p.y - p.gap/2);
      ctx.fillRect(p.x, p.y + p.gap/2, 60, canvas.height);
      if(!p.passed && p.x < bird.x) { p.passed = true; score++; state.sharks += 100; save(); updateVisuals(); document.getElementById('game-score').innerText = score; }
      if(bird.x+20 > p.x && bird.x < p.x+60 && (bird.y < p.y-p.gap/2 || bird.y+20 > p.y+p.gap/2)) gameActive = false;
    });
    ctx.fillStyle = "yellow"; ctx.fillRect(bird.x, bird.y, 20, 20);
    if(bird.y > canvas.height || bird.y < 0) gameActive = false;
    if(!gameActive) setTimeout(() => { document.getElementById('game-container').style.display='none'; }, 1000);
    else { frame++; requestAnimationFrame(gameLoop); }
  }
  document.getElementById('game-container').onclick = () => { if(gameActive) bird.v = -7; };

  setInterval(updateVisuals, 1000);
  updateVisuals();
</script>
</body>
</html>
