<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Clicker Batya Sounds</title>

  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root { 
      --red: #ff0000; --gold: #ffcc00; --blue: #00d4ff; 
      --glass: rgba(10, 10, 10, 0.95); --border: rgba(255, 255, 255, 0.1); 
    }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; font-weight: 900; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; text-transform: uppercase; }
    body { background-position: center !important; background-size: cover !important; color: #fff; font-family: 'Arial Black', sans-serif; display: flex; justify-content: center; align-items: center; }

    /* СНЕГ */
    .snow-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .snow-container::before {
      content: ""; position: absolute; top: -100%; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(3px 3px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(4px 4px at 150px 150px, #fff, rgba(0,0,0,0));
      background-size: 300px 300px; animation: snow-anim 15s linear infinite; opacity: 0.3;
    }
    @keyframes snow-anim { from { transform: translateY(0); } to { transform: translateY(100vh); } }

    /* ИНТЕРФЕЙС */
    .stats { position: fixed; top: 20px; left: 20px; z-index: 100; padding: 12px; border-radius: 15px; background: var(--glass); border: 2px solid var(--border); }
    #bal { font-size: 28px; color: var(--gold); }
    #buff-timer { color: var(--red); font-size: 16px; display: none; margin-top: 5px; }
    
    .controls-bottom { position: fixed; bottom: 20px; right: 20px; display: flex; gap: 8px; z-index: 100; }
    .btn-ui { padding: 10px 15px; border-radius: 12px; background: var(--glass); border: 2px solid var(--border); color: white; cursor: pointer; font-size: 12px; }
    
    #crushBtn { padding: 50px 85px; font-size: 45px; background: linear-gradient(180deg, var(--red), #700); color: #fff; border: none; border-radius: 35px; box-shadow: 0 10px 0 #300; cursor: pointer; transition: 0.05s; z-index: 5; }
    #crushBtn:active { transform: translateY(6px); box-shadow: 0 4px 0 #300; }

    /* КОМПАКТНЫЙ МАРКЕТ */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 2000; }
    .modal-overlay.active { display: flex; }
    .shop-window { width: 95%; max-height: 85vh; background: var(--glass); border-radius: 20px; padding: 12px; overflow-y: auto; border: 2px solid var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 8px; }
    
    .item-card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 8px; text-align: center; border: 1px solid var(--border); }
    .wp-preview { width: 100%; height: 50px; border-radius: 8px; margin-bottom: 5px; background-size: cover; background-position: center; border: 1px solid #333; }
    .item-info { color: var(--blue); font-size: 10px; margin-bottom: 2px; }
    .item-price { color: var(--gold); font-size: 11px; margin-bottom: 5px; }
    
    .buy-btn { width: 100%; padding: 8px 0; border-radius: 8px; border: none; background: var(--red); color: #fff; font-size: 11px; cursor: pointer; box-shadow: 0 3px 0 #500; }
    .buy-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #500; }
    .buy-btn.active-item { background: var(--gold); color: #000; box-shadow: 0 3px 0 #970; }

    #game-container { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; }
  </style>
</head>
<body>

<div class="snow-container"></div>
<audio id="bgMusic" loop><source src="fonovaya_muzyka.mp3" type="audio/mpeg"></audio>

<div id="game-container">
    <div style="position:absolute; top:30px; width:100%; text-align:center; color:var(--blue); font-size:20px;">СЧЕТ: <span id="game-score">0</span></div>
    <canvas id="game-canvas"></canvas>
</div>

<div class="stats">
  <div id="bal">0</div>
  <div style="font-size:11px;">МНОЖИТЕЛЬ: <span id="mult-view" style="color:var(--blue)">x1</span></div>
  <div id="buff-timer">05:00</div>
  <div style="color:var(--blue); font-size:16px; margin-top:4px;">🦈 <span id="sharks">0</span></div>
</div>

<button class="btn-ui" style="position:fixed; top:20px; right:20px; z-index:100; color:var(--gold); font-size:14px;" onclick="toggleShop(true)">МАРКЕТ</button>

<div class="controls-bottom">
  <button class="btn-ui" id="musicToggle" onclick="toggleMusic()">🎵 ВЫКЛ</button>
  <button class="btn-ui" onclick="startMiniGame()" style="color:var(--blue);">ИГРА</button>
</div>

<div class="modal-overlay" id="modal" onclick="if(event.target == this) toggleShop(false)">
  <div class="shop-window">
    <div style="display:flex; gap:5px; margin-bottom:12px; overflow-x:auto;">
        <button class="btn-ui" onclick="renderShop('sounds')">ЗВУКИ</button>
        <button class="btn-ui" onclick="renderShop('wallpapers')">ОБОИ</button>
        <button class="btn-ui" onclick="renderShop('buffs')">БАФФЫ</button>
    </div>
    <div id="shop-content" class="grid"></div>
  </div>
</div>

<button id="crushBtn">CRUSH</button>

<script>
  // УСТАНОВКА И ОФФЛАЙН
  let deferredPrompt;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferredPrompt = e;
    setTimeout(() => { if (confirm("УСТАНОВИТЬ НА РАБОЧИЙ СТОЛ?")) deferredPrompt.prompt(); }, 5000);
  });

  const FOLDERS = {
    sounds: [
        { id: "s1", n: "УДАР", p: 0, inc: 10, f: "sounds.mp3" },
        { id: "s2", n: "БАЛГАРКА", p: 1000, inc: 50, f: "sound2.mp3" },
        { id: "s3", n: "МУСЛИМ", p: 5000, inc: 150, f: "sound3.mp3" },
        { id: "s4", n: "ОТХУЯРЮ", p: 15000, inc: 450, f: "sound4.mp3" },
        { id: "s5", n: "ПИСЮН", p: 50000, inc: 1200, f: "sound5.mp3" },
        { id: "s6", n: "ГАДАЛКА", p: 200000, inc: 4000, f: "sound6.mp3" },
        { id: "s7", n: "ВАДИМ", p: 1000000, inc: 10000, f: "sound7.mp3" },
        { id: "s8", n: "ЦИГАНЕ", p: 2500000, inc: 25000, f: "sound8.mp3" },
        { id: "s9", n: "НАХУЙ", p: 6000000, inc: 60000, f: "sound9.mp3" },
        { id: "s10", n: "НЕ ХОЧЕШЬ", p: 12000000, inc: 150000, f: "sound10.mp3" },
        { id: "s11", n: "ВЫРЯДИЛСЯ", p: 30000000, inc: 400000, f: "sound11.mp3" },
        { id: "s12", n: "ГАНДОН", p: 100000000, inc: 1000000, f: "sound12.mp3" }
    ],
    wallpapers: [
        { id: "w1", n: "ПУСТОТА", p: 0, f: "" },
        { id: "w2", n: "БРИГАДА", p: 1000, f: "photo_7_2026-02-01_23-17-09.jpg" },
        { id: "w3", n: "БРАТКИ", p: 3000, f: "photo_14_2026-02-01_23-17-09.jpg" },
        { id: "w4", n: "ГРЯЗЬ", p: 6000, f: "photo_13_2026-02-01_23-17-09.jpg" },
        { id: "w5", n: "СПЕЦ", p: 12000, f: "photo_12_2026-02-01_23-17-09.jpg" },
        { id: "w6", n: "ШОК", p: 25000, f: "photo_11_2026-02-01_23-17-09.jpg" },
        { id: "w7", n: "ДЕВУШКА", p: 50000, f: "photo_10_2026-02-01_23-17-09.jpg" },
        { id: "w8", n: "РЫБАК", p: 100000, f: "photo_9_2026-02-01_23-17-09.jpg" },
        { id: "w9", n: "МАЙКА", p: 250000, f: "photo_8_2026-02-01_23-17-09.jpg" },
        { id: "w10", n: "СПОРТ", p: 500000, f: "photo_6_2026-02-01_23-17-09.jpg" },
        { id: "w11", n: "УШАНКА", p: 1000000, f: "photo_5_2026-02-01_23-17-09.jpg" },
        { id: "w12", n: "СКЛАД", p: 2500000, f: "image_24be59.png" }
    ],
    buffs: [
      { id: "b2", n: "БУСТ x2", p: 500, mult: 2 },
      { id: "b3", n: "БУСТ x3", p: 1500, mult: 3 },
      { id: "b5", n: "БУСТ x5", p: 5000, mult: 5 },
    ]
  };

  let state = JSON.parse(localStorage.getItem('batya_final_save')) || {
    balance: 0, sharks: 0, currentSound: "s1", currentWp: "w1", inv: ["s1", "w1"], income: 10, activeBuff: 1, buffEndTime: 0
  };

  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = 0.15;
  let musicEnabled = false, effAudio = new Audio();

  function save() { localStorage.setItem('batya_final_save', JSON.stringify(state)); }

  function updateVisuals() {
    document.getElementById('bal').innerText = Math.floor(state.balance).toLocaleString();
    document.getElementById('sharks').innerText = state.sharks.toLocaleString();
    const wp = FOLDERS.wallpapers.find(w => w.id === state.currentWp);
    document.body.style.backgroundImage = wp && wp.f ? `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url(${wp.f})` : "none";

    let now = Date.now();
    if (state.buffEndTime > now) {
      let left = Math.ceil((state.buffEndTime - now) / 1000);
      let m = Math.floor(left / 60), s = left % 60;
      document.getElementById('buff-timer').style.display = 'block';
      document.getElementById('buff-timer').innerText = `БАФФ: ${m}:${s < 10 ? '0' + s : s}`;
      document.getElementById('mult-view').innerText = "x" + state.activeBuff;
    } else {
      state.activeBuff = 1; document.getElementById('buff-timer').style.display = 'none';
      document.getElementById('mult-view').innerText = "x1";
    }
  }

  function toggleMusic() {
    musicEnabled = !musicEnabled;
    musicEnabled ? bgMusic.play() : bgMusic.pause();
    document.getElementById('musicToggle').innerText = musicEnabled ? "🎵 ВКЛ" : "🎵 ВЫКЛ";
  }

  function toggleShop(open) {
    document.getElementById('modal').classList.toggle('active', open);
    if(open) renderShop('sounds');
  }

  function renderShop(tab) {
    const container = document.getElementById('shop-content');
    container.innerHTML = '';
    FOLDERS[tab].forEach(item => {
      const owned = state.inv.includes(item.id);
      const isCur = (tab === 'sounds' && state.currentSound === item.id) || (tab === 'wallpapers' && state.currentWp === item.id);
      let preview = (tab === 'wallpapers' && item.f) ? `<div class="wp-preview" style="background-image:url(${item.f})"></div>` : '';
      let info = tab === 'sounds' ? `ДАЕТ: +${item.inc}` : (tab === 'buffs' ? `БУСТ: x${item.mult}` : 'ФОН');
      let price = owned ? "КУПЛЕНО" : `ЦЕНА: ${item.p}${tab === 'buffs' ? '🦈' : ''}`;
      let btnText = isCur ? "АКТИВ" : (owned ? "ВЫБРАТЬ" : "КУПИТЬ");

      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `${preview}<div style="font-size:10px; margin-bottom:4px;">${item.n}</div>
        <div class="item-info">${info}</div><div class="item-price">${price}</div>
        <button class="buy-btn ${isCur ? 'active-item' : ''}" onclick="buy('${tab}','${item.id}')">${btnText}</button>`;
      container.appendChild(card);
    });
  }

  window.buy = (tab, id) => {
    const item = FOLDERS[tab].find(x => x.id === id);
    if (tab === 'buffs') {
      if (state.sharks >= item.p && state.activeBuff === 1) {
        state.sharks -= item.p; state.activeBuff = item.mult; state.buffEndTime = Date.now() + 300000;
        toggleShop(false);
      } else if (state.activeBuff !== 1) alert("ЖДИ КОНЦА БАФФА!");
      else alert("МАЛО АКУЛ!");
    } else {
      if (state.inv.includes(id)) {
        if(tab === 'sounds') { state.currentSound = id; state.income = item.inc; } else state.currentWp = id;
      } else if (state.balance >= item.p) {
        state.balance -= item.p; state.inv.push(id);
        if(tab === 'sounds') { state.currentSound = id; state.income = item.inc; } else state.currentWp = id;
      }
    }
    save(); updateVisuals(); if(document.getElementById('modal').classList.contains('active')) renderShop(tab);
  };

  document.getElementById('crushBtn').onclick = () => {
    if (navigator.vibrate) navigator.vibrate(45);
    const sData = FOLDERS.sounds.find(s => s.id === state.currentSound);
    effAudio.src = sData.f; effAudio.currentTime = 0; effAudio.play();
    state.balance += (state.income * state.activeBuff);
    updateVisuals(); save();
  };

  const canvas = document.getElementById('game-canvas'), ctx = canvas.getContext('2d');
  let gameActive = false, bird, pipes, score, frame;

  function startMiniGame() {
    document.getElementById('game-container').style.display = 'block';
    canvas.width = Math.min(400, window.innerWidth); canvas.height = window.innerHeight;
    gameActive = true; score = 0; pipes = []; frame = 0;
    bird = { x: 50, y: canvas.height/2, v: 0, g: 0.5 };
    gameLoop();
  }

  function gameLoop() {
    if(!gameActive) return;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    bird.v += bird.g; bird.y += bird.v;
    if(frame % 90 === 0) pipes.push({ x: canvas.width, y: Math.random()*(canvas.height-350)+175, gap: 250, passed: false });
    pipes.forEach((p, i) => {
      p.x -= 4; ctx.fillStyle = "#00d4ff";
      ctx.fillRect(p.x, 0, 60, p.y - p.gap/2); ctx.fillRect(p.x, p.y + p.gap/2, 60, canvas.height);
      if(!p.passed && p.x < bird.x) { p.passed = true; score++; state.sharks += 100; save(); updateVisuals(); document.getElementById('game-score').innerText = score; }
      if(bird.x+20 > p.x && bird.x < p.x+60 && (bird.y < p.y-p.gap/2 || bird.y+20 > p.y+p.gap/2)) gameActive = false;
    });
    ctx.fillStyle = "yellow"; ctx.fillRect(bird.x, bird.y, 22, 22);
    if(bird.y > canvas.height || bird.y < 0) gameActive = false;
    if(!gameActive) setTimeout(() => { document.getElementById('game-container').style.display='none'; }, 1200);
    else { frame++; requestAnimationFrame(gameLoop); }
  }
  document.getElementById('game-container').onclick = () => { if(gameActive) bird.v = -7.5; };

  setInterval(updateVisuals, 1000);
  updateVisuals();
</script>
</body>
</html>
