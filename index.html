<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BatyaClicker</title>
  <style>
    :root { 
      --red: #ff3b30; --gold: #ffcc00; --blue: #007aff; 
      --bg: #050505; --text: #fff; --glass: rgba(25, 25, 25, 0.9); 
      --border: rgba(255, 255, 255, 0.1); --card: rgba(255, 255, 255, 0.05);
      --accent: linear-gradient(135deg, #007aff, #00d4ff);
    }
    [data-theme="light"] {
      --bg: #f2f2f7; --text: #1c1c1e; --glass: rgba(255, 255, 255, 0.9);
      --border: rgba(0, 0, 0, 0.1); --card: rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, sans-serif; font-weight: 800; user-select: none; }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); text-transform: uppercase; }
    body { display: flex; justify-content: center; align-items: center; background-size: cover !important; background-position: center !important; }

    .stats { position: fixed; top: 20px; left: 15px; z-index: 100; padding: 15px 20px; background: var(--glass); border-radius: 20px; border: 1px solid var(--border); backdrop-filter: blur(20px); }
    #bal { font-size: 28px; color: var(--gold); }
    
    .top-right { position: fixed; top: 20px; right: 15px; z-index: 100; display: flex; gap: 8px; }
    .btn-circle { width: 50px; height: 50px; border-radius: 15px; border: 1px solid var(--border); background: var(--glass); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    #crushBtn { padding: 80px 110px; font-size: 50px; border-radius: 50px; border: none; background: linear-gradient(180deg, #ff453a, #8b0000); color: #fff; box-shadow: 0 15px 0 #600; cursor: pointer; transition: 0.1s; }
    #crushBtn:active { transform: translateY(10px); box-shadow: 0 5px 0 #600; }

    .bottom-bar { position: fixed; bottom: 25px; display: flex; gap: 10px; z-index: 200; width: 90%; max-width: 500px; }
    .btn-nav { flex: 1; padding: 15px; border-radius: 18px; border: 1px solid var(--border); background: var(--glass); color: #fff; font-size: 10px; cursor: pointer; text-align: center; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: flex-end; z-index: 1000; backdrop-filter: blur(10px); }
    .modal.active { display: flex; }
    .sheet { width: 100%; max-width: 550px; height: 80vh; background: var(--bg); border-radius: 35px 35px 0 0; border-top: 2px solid var(--border); display: flex; flex-direction: column; padding: 20px; }
    
    .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
    .tab-btn { padding: 12px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 10px; white-space: nowrap; }
    .tab-btn.active { background: var(--text); color: var(--bg); }

    .content { flex: 1; overflow-y: auto; padding-bottom: 30px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card { background: var(--card); border-radius: 20px; padding: 15px; text-align: center; border: 1px solid var(--border); }
    .wp-preview { width: 100%; height: 80px; border-radius: 12px; margin-bottom: 8px; background-size: cover; background-position: center; background-color: #333; border: 1px solid rgba(255,255,255,0.1); }
    
    .action-btn { width: 100%; padding: 12px; border: none; border-radius: 12px; background: var(--blue); color: #fff; font-size: 10px; margin-top: 8px; cursor: pointer; }
    .action-btn.owned { background: var(--gold); color: #000; }

    #game-box { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; }
  </style>
</head>
<body data-theme="dark">

<audio id="bgMusic" loop><source src="fonovaya_muzyka.mp3" type="audio/mpeg"></audio>

<div class="stats">
  <div id="bal">0</div>
  <div style="font-size:11px; opacity:0.7;">x<span id="boost-val">1</span> • 🦈 <span id="shark-val">0</span></div>
  <div style="font-size:9px; color: var(--blue); margin-top:5px;">ID: <span id="my-id">...</span></div>
</div>

<div class="top-right">
  <button class="btn-circle" onclick="toggleM('win-set')">⚙️</button>
</div>

<button id="crushBtn">CRUSH</button>

<div class="bottom-bar">
  <button class="btn-nav" onclick="startGame()">🎮 ИГРА</button>
  <button class="btn-nav" onclick="toggleM('win-tr')">💸 ПЕРЕВОД</button>
  <button class="btn-nav" onclick="toggleM('win-shop')">🎒 МАРКЕТ</button>
</div>

<div id="win-shop" class="modal" onclick="if(event.target==this)toggleM('win-shop')">
  <div class="sheet">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('sounds', this)">ЗВУКИ</button>
      <button class="tab-btn" onclick="switchTab('wallpapers', this)">ФОНЫ</button>
      <button class="tab-btn" onclick="switchTab('buffs', this)">БАФФЫ</button>
    </div>
    <div id="shop-grid" class="grid content"></div>
  </div>
</div>

<div id="win-tr" class="modal" onclick="if(event.target==this)toggleM('win-tr')">
  <div class="sheet" style="height: auto; border-radius: 35px;">
    <h2 style="text-align:center;">ПЕРЕВОД</h2>
    <input type="number" id="tr-id" placeholder="ID" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; background:var(--card); color:white; border:1px solid var(--border);">
    <input type="number" id="tr-sum" placeholder="СУММА" style="width:100%; padding:15px; margin-bottom:10px; border-radius:10px; background:var(--card); color:white; border:1px solid var(--border);">
    <button class="action-btn" onclick="alert('ОТПРАВЛЕНО!'); toggleM('win-tr')">ПОДТВЕРДИТЬ</button>
  </div>
</div>

<div id="win-set" class="modal" onclick="if(event.target==this)toggleM('win-set')">
  <div class="sheet" style="height: auto; border-radius: 35px;">
    <h2>НАСТРОЙКИ</h2>
    <button class="action-btn" onclick="toggleMusic()">МУЗЫКА ВКЛ/ВЫКЛ</button>
    <button class="action-btn" style="background:gray;" onclick="toggleTheme()">СМЕНИТЬ ТЕМУ</button>
  </div>
</div>

<div id="game-box">
  <canvas id="canvas"></canvas>
</div>

<script>
  const DATA = {
    sounds: [
      { id: "s1", n: "УДАР", p: 0, inc: 10, f: "sounds.mp3" },
      { id: "s2", n: "БАЛГАРКА", p: 1000, inc: 50, f: "sound2.mp3" },
      { id: "s3", n: "МУСЛИМ", p: 5000, inc: 150, f: "sound3.mp3" },
      { id: "s4", n: "ОТХУЯРЮ", p: 15000, inc: 450, f: "sound4.mp3" },
      { id: "s5", n: "ПИСЮН", p: 50000, inc: 1200, f: "sound5.mp3" },
      { id: "s6", n: "ГАДАЛКА", p: 200000, inc: 4000, f: "sound6.mp3" },
      { id: "s7", n: "ВАДИМ", p: 1000000, inc: 10000, f: "sound7.mp3" },
      { id: "s8", n: "ЦИГАНЕ", p: 2500000, inc: 25000, f: "sound8.mp3" },
      { id: "s9", n: "НАХУЙ", p: 6000000, inc: 60000, f: "sound9.mp3" },
      { id: "s10", n: "НЕ ХОЧЕШЬ", p: 12000000, inc: 150000, f: "sound10.mp3" },
      { id: "s11", n: "ВЫРЯДИЛСЯ", p: 30000000, inc: 400000, f: "sound11.mp3" },
      { id: "s12", n: "ГАНДОН", p: 100000000, inc: 1000000, f: "sound12.mp3" }
    ],
    wallpapers: [
      { id: "w1", n: "СТАНДАРТ", p: 0, f: "" },
      { id: "w2", n: "ФОТО 1", p: 500, f: "photo_1_2026-02-01_23-17-09.jpg" },
      { id: "w3", n: "ФОТО 2", p: 1000, f: "photo_2_2026-02-01_23-17-09.jpg" },
      { id: "w4", n: "ФОТО 3", p: 2000, f: "photo_3_2026-02-01_23-17-09.jpg" },
      { id: "w5", n: "ФОТО 4", p: 4000, f: "photo_4_2026-02-01_23-17-09.jpg" },
      { id: "w6", n: "ФОТО 5", p: 8000, f: "photo_5_2026-02-01_23-17-09.jpg" },
      { id: "w7", n: "ФОТО 6", p: 15000, f: "photo_6_2026-02-01_23-17-09.jpg" },
      { id: "w8", n: "ФОТО 7", p: 30000, f: "photo_7_2026-02-01_23-17-09.jpg" },
      { id: "w9", n: "ФОТО 8", p: 60000, f: "photo_8_2026-02-01_23-17-09.jpg" },
      { id: "w10", n: "ФОТО 9", p: 120000, f: "photo_9_2026-02-01_23-17-09.jpg" },
      { id: "w11", n: "ФОТО 10", p: 250000, f: "photo_10_2026-02-01_23-17-09.jpg" },
      { id: "w12", n: "ФОТО 11", p: 500000, f: "photo_11_2026-02-01_23-17-09.jpg" },
      { id: "w13", n: "ФОТО 12", p: 1000000, f: "photo_12_2026-02-01_23-17-09.jpg" },
      { id: "w14", n: "ФОТО 13", p: 2500000, f: "photo_13_2026-02-01_23-17-09.jpg" },
      { id: "w15", n: "ФОТО 14", p: 5000000, f: "photo_14_2026-02-01_23-17-09.jpg" }
    ],
    buffs: [
      { id: "b2", n: "x2 БУСТ", p: 500, m: 2 },
      { id: "b5", n: "x5 БУСТ", p: 2500, m: 5 },
      { id: "b10", n: "x10 БУСТ", p: 10000, m: 10 }
    ]
  };

  let state = { bal: 0, sh: 0, cS: "s1", cW: "w1", inv: ["s1", "w1"], inc: 10, aB: 1, music: false, theme: "dark", uid: 0 };
  
  function getIPID() {
    let s = window.navigator.userAgent + window.navigator.language;
    let h = 0;
    for (let i = 0; i < s.length; i++) h = (h << 5) - h + s.charCodeAt(i);
    return Math.abs(h % 10000000);
  }

  const saved = localStorage.getItem('batya_final_v1');
  if(saved) state = Object.assign(state, JSON.parse(saved));
  state.uid = getIPID();

  const eff = new Audio(), bgm = document.getElementById('bgMusic');

  function save() { localStorage.setItem('batya_final_v1', JSON.stringify(state)); }
  
  function uV() {
    document.getElementById('bal').textContent = Math.floor(state.bal).toLocaleString();
    document.getElementById('shark-val').textContent = state.sh.toLocaleString();
    document.getElementById('boost-val').textContent = state.aB;
    document.getElementById('my-id').textContent = state.uid;
    document.body.setAttribute('data-theme', state.theme);
    const wp = DATA.wallpapers.find(w => w.id === state.cW);
    document.body.style.background = wp && wp.f ? `linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.6)), url(${wp.f})` : "var(--bg)";
  }

  function toggleM(id) { document.getElementById(id).classList.toggle('active'); if(id==='win-shop') renderMarket('sounds'); }

  function switchTab(t, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMarket(t);
  }

  function renderMarket(type) {
    const grid = document.getElementById('shop-grid'); grid.innerHTML = '';
    DATA[type].forEach(i => {
      const owned = state.inv.includes(i.id);
      const active = (state.cS===i.id || state.cW===i.id || (type==='buffs' && state.aB===i.m));
      let pre = (type==='wallpapers') ? `<div class="wp-preview" style="background-image:url(${i.f})"></div>` : '';
      grid.innerHTML += `<div class="card">${pre}<div>${i.n}</div>
        <div style="color:var(--gold); font-size:10px; margin:5px 0;">${owned?'КУПЛЕНО':i.p.toLocaleString()+(type==='buffs'?' 🦈':' КЛ')}</div>
        <button class="action-btn ${active?'owned':''}" onclick="buy('${type}','${i.id}')">${active?'АКТИВНО':(owned?'ВЫБРАТЬ':'КУПИТЬ')}</button></div>`;
    });
  }

  window.buy = (t, id) => {
    const item = DATA[t].find(x => x.id === id);
    if (!state.inv.includes(id)) {
      const cur = t==='buffs'?'sh':'bal';
      if(state[cur]>=item.p) { state[cur]-=item.p; state.inv.push(id); } else return alert("НЕДОСТАТОЧНО СРЕДСТВ");
    }
    if(t==='sounds') { state.cS=id; state.inc=item.inc; }
    else if(t==='wallpapers') state.cW=id;
    else if(t==='buffs') state.aB=item.m;
    uV(); save(); renderMarket(t);
  };

  document.getElementById('crushBtn').onclick = () => {
    const s = DATA.sounds.find(x => x.id === state.cS);
    if(eff.src.indexOf(s.f)===-1) eff.src = s.f;
    eff.currentTime=0; eff.play().catch(()=>{});
    state.bal += state.inc * state.aB; uV(); save();
  };

  function toggleMusic() { state.music = !state.music; state.music ? bgm.play() : bgm.pause(); save(); }
  function toggleTheme() { state.theme = state.theme==='dark'?'light':'dark'; uV(); save(); }

  // МИНИ ИГРА
  const cvs = document.getElementById('canvas'), ctx = cvs.getContext('2d');
  let gA = false, ps = [], brd = {};

  function startGame() {
    document.getElementById('game-box').style.display='block';
    cvs.width=window.innerWidth; cvs.height=window.innerHeight;
    gA=true; ps=[]; brd={x:50, y:cvs.height/2, v:0, g:0.5};
    loop();
  }

  cvs.onclick = () => { if(gA) brd.v = -8; else document.getElementById('game-box').style.display='none'; };

  function loop() {
    if(!gA) return;
    ctx.fillStyle="#000"; ctx.fillRect(0,0,cvs.width,cvs.height);
    brd.v += brd.g; brd.y += brd.v;
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(brd.x, brd.y, 20, 0, Math.PI*2); ctx.fill();
    if(brd.y > cvs.height || brd.y < 0) gA=false;
    if(!gA) { ctx.fillStyle="red"; ctx.font="20px Arial"; ctx.fillText("КОНЕЦ! КЛИКНИ ДЛЯ ВЫХОДА", 50, cvs.height/2); }
    requestAnimationFrame(loop);
  }

  uV();
</script>
</body>
</html>
